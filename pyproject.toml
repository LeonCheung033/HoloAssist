[project]
name = "holoassist"
version = "0.1.0"
description = "基于大语言模型构建的智能客服系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.124.4",
    "greenlet>=3.3.0",
    "httpx>=0.24.0",
    "loguru>=0.7.3",
    "numpy>=1.24.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.45",
    "tenacity>=8.0.0",
]  # 运行时依赖将在各阶段按需添加

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N802"]  # N802: 允许property方法使用大写命名（与配置字段保持一致）

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
# 忽略redis类型存根问题（已安装types-redis但mypy可能无法识别）
[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.9",
    "types-redis>=4.6.0.20241004",
]

# Coverage options are specified in CI and check_code_quality.sh script
# Not in addopts to allow flexible coverage reporting and avoid conflicts
